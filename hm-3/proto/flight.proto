syntax = "proto3";

package flight.v1;

option go_package = "flightbooking/generated/flightv1;flightv1";

import "google/protobuf/timestamp.proto";

service FlightService {
  // INVALID_ARGUMENT: invalid IATA codes or timestamp.
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  // NOT_FOUND: no such flight.
  rpc GetFlight(GetFlightRequest) returns (Flight);
  // NOT_FOUND: flight missing; FAILED_PRECONDITION: flight is not scheduled.
  // RESOURCE_EXHAUSTED: not enough seats; ALREADY_EXISTS: booking ID conflict.
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  // NOT_FOUND: unknown booking ID; released reservations can be released again.
  rpc ReleaseReservation(ReleaseReservationRequest) returns (SeatReservation);
  // Optional catalog operation to demonstrate cache invalidation.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

// All RPCs require x-api-key metadata. Missing/invalid key: UNAUTHENTICATED.
// Bad input: INVALID_ARGUMENT. Temporary failures: UNAVAILABLE/DEADLINE_EXCEEDED.

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  SCHEDULED = 1;
  DEPARTED = 2;
  CANCELLED = 3;
  COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  RELEASED = 2;
  EXPIRED = 3;
}

message Flight {
  int64 id = 1;
  string flight_number = 2;
  string airline_code = 3;
  string airline_name = 4;
  string origin = 5;
  string destination = 6;
  google.protobuf.Timestamp departure_at = 7;
  google.protobuf.Timestamp arrival_at = 8;
  int32 total_seats = 9;
  int32 available_seats = 10;
  int64 price_cents = 11;
  FlightStatus status = 12;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // Optional; its UTC calendar day is used.
  google.protobuf.Timestamp departure_date = 3;
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  int64 flight_id = 1;
}

message ReserveSeatsRequest {
  int64 flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
}

message ReleaseReservationRequest {
  string booking_id = 1;
}

message SeatReservation {
  string booking_id = 1;
  int64 flight_id = 2;
  int32 seat_count = 3;
  ReservationStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message UpdateFlightRequest {
  int64 flight_id = 1;
  optional int64 price_cents = 2;
  optional FlightStatus status = 3;
}
